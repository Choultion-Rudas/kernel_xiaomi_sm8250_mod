name: Auto Sync & Build Release Kernel (Daily)

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间早上 8:00 自动检查一次
  workflow_dispatch:
    inputs:
      force_build_tag:
        description: "手动强制编译特定 Tag（留空则只在检测到新 Release 时运行）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check for New Upstream Release
        id: check
        run: |
          FORCE_TAG="${{ github.event.inputs.force_build_tag }}"
          if [ -n "$FORCE_TAG" ]; then
            echo "trigger_build=true" >> $GITHUB_OUTPUT
            echo "target_tag=$FORCE_TAG" >> $GITHUB_OUTPUT
          else
            UPSTREAM_TAG=$(curl -s https://api.github.com/repos/liyafe1997/kernel_xiaomi_sm8250_mod/releases/latest | jq -r '.tag_name')
            MY_TAG=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name' || echo "")
            
            if [ "$MY_TAG" = "null" ]; then MY_TAG=""; fi

            if [ "$UPSTREAM_TAG" != "$MY_TAG" ] && [ -n "$UPSTREAM_TAG" ] && [ "$UPSTREAM_TAG" != "null" ]; then
              echo "trigger_build=true" >> $GITHUB_OUTPUT
              echo "target_tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
            else
              echo "trigger_build=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Checkout Code
        if: steps.check.outputs.trigger_build == 'true'
        uses: actions/checkout@v4
        with:
          ref: android15-lineage22-mod
          fetch-depth: 0

      - name: Sync and Checkout Target Tag
        if: steps.check.outputs.trigger_build == 'true'
        run: |
          TARGET_TAG="${{ steps.check.outputs.target_tag }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git remote add upstream https://github.com/liyafe1997/kernel_xiaomi_sm8250_mod.git
          git fetch upstream --tags
          
          git checkout "tags/$TARGET_TAG"
          git push origin "tags/$TARGET_TAG" || echo "Tag already exists on origin"

      - name: Install Build Dependencies
        if: steps.check.outputs.trigger_build == 'true'
        run: |
          sudo apt update
          sudo apt install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 libncurses5

      - name: Download Toolchain
        if: steps.check.outputs.trigger_build == 'true'
        run: |
          mkdir -p $HOME/proton-clang
          cd $HOME/proton-clang
          wget https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip
          unzip 20210522.zip

      - name: Compile Kernel
        if: steps.check.outputs.trigger_build == 'true'
        run: |
          bash build.sh umi ksu

      - name: Auto Publish Release
        if: steps.check.outputs.trigger_build == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.check.outputs.target_tag }}
          name: "Xiaomi Mi 10 Kernel (${{ steps.check.outputs.target_tag }}) - SukiSU"
          body: |
            自动同步编译自上游 Release 版本: `${{ steps.check.outputs.target_tag }}`
            原版内核级 SukiSU-Ultra 驱动，完美兼容并支持 ReSukiSU 客户端接管。
          draft: false
          prerelease: false
          files: |
            *.zip
